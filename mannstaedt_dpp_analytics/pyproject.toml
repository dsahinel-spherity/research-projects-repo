[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mannstaedt-dpp-analytics"
version = "0.1.0"
description = "Mannstaedt DPP analytics dashboard and analytics engine"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "analytics_engine*"]